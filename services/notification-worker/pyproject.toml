[project]
name = "notification-worker"
version = "0.1.0"
description = "Sends receipt emails and writes PDF invoices for confirmed OrderFlow orders."
requires-python = ">=3.13"
dependencies = [
    "orderflow-common",
]

[tool.uv.sources]
orderflow-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
