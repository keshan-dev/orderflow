[project]
name = "search-indexer"
version = "0.1.0"
description = "Keeps the OrderFlow orders search index up to date from orders.events."
requires-python = ">=3.13"
dependencies = [
    "opensearch-py>=3.0",
    "orderflow-common",
]

[tool.uv.sources]
orderflow-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
