[project]
name = "order-service"
version = "0.1.0"
description = "Public order API for OrderFlow, and the orchestrator of the order saga."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "opensearch-py>=3.0",
    "orderflow-common",
    "uvicorn>=0.38",
]

[tool.uv.sources]
orderflow-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
