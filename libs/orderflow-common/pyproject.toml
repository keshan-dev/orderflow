[project]
name = "orderflow-common"
version = "0.1.0"
description = "Shared code for OrderFlow Python services: settings, JSON logging and connections."
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=6.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
