# OrderFlow Phase 1 local stack.
# Run from the repo root:  docker compose -f deploy/compose/docker-compose.yml up -d
# Secrets come from deploy/compose/.env (copy .env.example first). Never commit .env.
#
# The dev machine gives Docker about 3.9 GB of RAM, so every container has a memory limit.

name: orderflow

services:
  postgres:
    image: postgres:17.12-alpine
    command:
      - postgres
      - -c
      - wal_level=logical        # needed by Debezium to read the outbox tables
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_buffers=64MB
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in .env}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:?set CDC_DB_PASSWORD in .env}
    ports:
      # Host port 15432: a native PostgreSQL service already uses 5432 on the dev machine.
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:8.6.8-alpine
    # Append-only file so stock counts survive a restart. Postgres is still the source of truth.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.2
    # Single node in KRaft mode (no ZooKeeper). It is both the broker and the controller.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29092,CONTROLLER://:9093
      # Containers use kafka:19092. Tools on your machine use 127.0.0.1:29092
      # (Windows reserves ports 8995 to 9094 on the dev machine, so 9092 is not usable;
      # 127.0.0.1 instead of localhost, because localhost can resolve to ::1, where other
      # programs on the dev machine may listen).
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose by kafka-init, never by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    mem_limit: 256m
    restart: "no"

  kafka-connect:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: orderflow-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Connector configs read the cdc password from env at runtime, so it is never stored in Kafka.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:?set CDC_DB_PASSWORD in .env}
      HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    mem_limit: 896m
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    # Optional browser UI. Start it with:  --profile ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xmx256m
    ports:
      - "8085:8080"
    mem_limit: 448m
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.8-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    mem_limit: 384m
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms384m -Xmx384m
      # Local development only: plain HTTP, no login. Phase 2 and later turn security on.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    mem_limit: 1024m
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    # Optional browser UI. Start it with:  --profile ui
    profiles: ["ui"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: --max-old-space-size=320
    ports:
      - "5601:5601"
    mem_limit: 512m
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.54
    # S3-compatible object store (MinIO no longer publishes community images).
    # The credentials file is written at startup from env vars, so no secret is stored in the repo.
    entrypoint: ["/bin/sh", "/scripts/start-s3.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      # Host ports 7333 and 7888: Windows reserves 8295 to 8894 on the dev machine.
      - "7333:8333"   # S3 API
      - "7888:8888"   # file browser (filer UI)
    volumes:
      - s3-data:/data
      - ./s3/start-s3.sh:/scripts/start-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://localhost:8888/ && wget -q -S -O /dev/null -T 3 http://localhost:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  s3-init:
    image: chrislusf/seaweedfs:4.54
    depends_on:
      s3:
        condition: service_healthy
    # Safe to run again: creates the bucket only if it is not listed yet.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q 'orderflow-invoices';
        then echo 'bucket orderflow-invoices already exists';
        else echo 's3.bucket.create -name orderflow-invoices' | weed shell -master=s3:9333;
        fi
    mem_limit: 128m
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.33.1
    # Fake inbox: catches every email so nothing leaves your machine.
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped

  inventory-migrate:
    image: orderflow/inventory-service:dev
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    # 1-shot: apply migrations, then add sample products. Runs before the service starts.
    command: ["sh", "-c", "alembic upgrade head && python -m inventory_service.seed"]
    environment:
      DATABASE_URL: postgresql://inventory_user:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    restart: "no"

  inventory-service:
    image: orderflow/inventory-service:dev
    environment:
      DATABASE_URL: postgresql://inventory_user:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8002:8002"
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped

  order-migrate:
    image: orderflow/order-service:dev
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://orders_user:${ORDERS_DB_PASSWORD}@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m
    restart: "no"

  order-service-1:
    image: orderflow/order-service:dev
    environment:
      DATABASE_URL: postgresql://orders_user:${ORDERS_DB_PASSWORD}@postgres:5432/orders_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JOB_BACKEND: rabbitmq
      OPENSEARCH_URL: http://opensearch:9200
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-120}
      TIMEOUT_CHECK_SECONDS: ${TIMEOUT_CHECK_SECONDS:-10}
    ports:
      - "8001:8001"
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped

  order-service-2:
    # Second copy of order-service, same image. Only nginx reaches it (no host port).
    image: orderflow/order-service:dev
    environment:
      DATABASE_URL: postgresql://orders_user:${ORDERS_DB_PASSWORD}@postgres:5432/orders_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JOB_BACKEND: rabbitmq
      OPENSEARCH_URL: http://opensearch:9200
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-120}
      TIMEOUT_CHECK_SECONDS: ${TIMEOUT_CHECK_SECONDS:-10}
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped

  debezium-init:
    image: quay.io/debezium/connect:3.7.1.Final
    # 1-shot: registers the outbox connectors once Kafka Connect and the outbox tables exist.
    entrypoint: ["/bin/sh", "/scripts/register-connectors.sh"]
    volumes:
      - ./debezium/register-connectors.sh:/scripts/register-connectors.sh:ro
      - ./debezium/connectors:/connectors:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
      inventory-migrate:
        condition: service_completed_successfully
      payment-migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    restart: "no"

  payment-migrate:
    image: orderflow/payment-service:dev
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://payments_user:${PAYMENTS_DB_PASSWORD}@postgres:5432/payments_db
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    restart: "no"

  payment-service:
    image: orderflow/payment-service:dev
    environment:
      DATABASE_URL: postgresql://payments_user:${PAYMENTS_DB_PASSWORD}@postgres:5432/payments_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Fake provider controls: share of declined charges (0 to 1) and delay per call.
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0}
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-50}
    ports:
      - "8003:8003"
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/payment-service", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 64m
    restart: unless-stopped

  notification-worker:
    image: orderflow/notification-worker:dev
    build:
      context: ../..
      dockerfile: services/notification-worker/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_BUCKET: orderflow-invoices
      S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "orderflow_common.heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  opensearch-init:
    image: opensearchproject/opensearch:3.9.0
    # 1-shot: creates orders-v1 and the "orders" alias. The app always uses the alias.
    entrypoint: ["/bin/sh", "/opensearch/create-orders-index.sh"]
    volumes:
      - ./opensearch:/opensearch:ro
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 64m
    restart: "no"

  search-indexer:
    image: orderflow/search-indexer:dev
    build:
      context: ../..
      dockerfile: services/search-indexer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "orderflow_common.heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  nginx:
    image: nginx:1.30.7-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      order-service-1:
        condition: service_healthy
      order-service-2:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 64m
    restart: unless-stopped

  reconcile:
    image: orderflow/reconcile:dev
    build:
      context: ../..
      dockerfile: services/reconcile/Dockerfile
    # On demand only:  docker compose -f deploy/compose/docker-compose.yml run --rm reconcile
    profiles: ["tools"]
    # Reads every database as the read-only cdc user; it never changes anything.
    environment:
      ORDERS_DATABASE_URL: postgresql://cdc:${CDC_DB_PASSWORD}@postgres:5432/orders_db
      INVENTORY_DATABASE_URL: postgresql://cdc:${CDC_DB_PASSWORD}@postgres:5432/inventory_db
      PAYMENTS_DATABASE_URL: postgresql://cdc:${CDC_DB_PASSWORD}@postgres:5432/payments_db
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: orderflow-invoices
      S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      STUCK_AFTER_SECONDS: ${STUCK_AFTER_SECONDS:-300}
    mem_limit: 192m
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
  opensearch-data:
  s3-data:
