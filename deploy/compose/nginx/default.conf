# The only public entry point of the local stack: http://localhost:8080

# Docker's DNS. "resolve" below re-reads container addresses, so a restarted container
# with a new IP is found again without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream order_api {
    zone order_api 64k;
    # After 2 failures in 10 seconds, a container gets no traffic for 10 seconds.
    server order-service-1:8001 resolve max_fails=2 fail_timeout=10s;
    server order-service-2:8001 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

upstream inventory_api {
    zone inventory_api 64k;
    server inventory-service:8002 resolve max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # If a container is down, try the other one. POST /api/orders is safe to retry because
    # of its Idempotency-Key, so non_idempotent requests may be retried too.
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/products {
        proxy_pass http://inventory_api;
    }

    location /api/ {
        proxy_pass http://order_api;
    }

    location / {
        return 404;
    }
}
